spring.application.name=rag-app
server.port=8080

# Ollama (runs locally, no real API key needed)
openai.api.base-url=http://localhost:11434/v1
openai.api.key=ollama

# Models
openai.chat.model=llama3.2
openai.embedding.model=nomic-embed-text
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

rag.min-score=0.25
rag.top-k=4
rag.max-chunks=300

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB